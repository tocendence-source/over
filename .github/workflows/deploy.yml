name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck and verify content and security policy
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Sanity-check the build output
        run: |
          set -e
          test -f dist/index.html || { echo "dist/index.html is missing"; exit 1; }
          if grep -q 'src/main.tsx' dist/index.html; then
            echo "ERROR: dist/index.html still points at the dev entry /src/main.tsx"
            exit 1
          fi
          if ! grep -q "script-src 'self';" dist/index.html; then
            echo "ERROR: deployed CSP lost script-src 'self'"
            exit 1
          fi
          STRIPPED=$(perl -0777 -pe 's{<script type="application/ld\+json">.*?</script>}{}gs' dist/index.html)
          if printf '%s' "$STRIPPED" | grep -qzP '<script(?![^>]*\bsrc=)[^>]*>\s*[^<\s]'; then
            echo "ERROR: dist/index.html contains an inline script; script-src 'self' would block it"
            exit 1
          fi
          test -d dist/assets || { echo "dist/assets is missing"; exit 1; }
          ls -la dist dist/assets
          du -sh dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
